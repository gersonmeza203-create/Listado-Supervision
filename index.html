    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --surface2: #e2e8f0;
      --border: #c8d6e5;
      --accent: #1a6fcc;
      --accent2: #0a9e8a;
      --text: #1a2635;
      --text2: #4a6080;
      --presente: #0a9e6a;
      --ausente: #d93055;
      --excusa: #c07800;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 10%, rgba(26,111,204,.06) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 90%, rgba(10,158,138,.04) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    #app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #0a1628 0%, #0d2040 100%);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    .logo-circle {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px;
      color: #fff; letter-spacing: 1px; flex-shrink: 0;
      box-shadow: 0 0 18px rgba(26,140,255,.35); text-align: center; line-height: 1.2;
    }
    .header-text h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 17px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text); line-height: 1;
    }
    .header-text p { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .header-right { margin-left: auto; text-align: right; }
    #fecha-hora { font-family: 'Rajdhani', sans-serif; font-size: 12px; color: var(--accent2); font-weight: 600; }
    #reloj { font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); line-height: 1; }
    .online-row { display: flex; align-items: center; gap: 4px; margin-top: 2px; justify-content: flex-end; }
    #online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ausente); transition: background .4s; }
    #online-txt { font-size: 10px; color: var(--text2); }

    /* TABS */
    .tabs-bar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; gap: 4px; padding: 7px 10px; overflow-x: auto;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
      position: sticky; top: 70px; z-index: 99;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: none;
      font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700;
      background: transparent; color: var(--text2); cursor: pointer;
      transition: all .2s; white-space: nowrap;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), #005fbf);
      color: #fff; box-shadow: 0 3px 12px rgba(26,140,255,.35);
    }

    /* DATE BAR */
    .date-bar {
      background: var(--bg); border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      position: sticky; top: 112px; z-index: 98;
    }
    .date-arrow {
      flex-shrink: 0; width: 36px; height: 42px;
      background: var(--surface2); border: none;
      color: var(--text2); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .date-arrow:active { color: var(--accent); }
    .dates-scroll {
      flex: 1; display: flex; gap: 4px; overflow-x: auto;
      scrollbar-width: none; padding: 5px 6px;
      -webkit-overflow-scrolling: touch;
    }
    .dates-scroll::-webkit-scrollbar { display: none; }
    .date-chip {
      flex-shrink: 0; display: flex; flex-direction: column;
      align-items: center; padding: 5px 9px; border-radius: 9px;
      border: 1.5px solid var(--border); background: transparent;
      cursor: pointer; transition: all .18s; min-width: 42px;
    }
    .date-chip .dc-day { font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700; color: var(--text); line-height: 1; }
    .date-chip .dc-dow { font-size: 10px; font-weight: 700; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }
    .date-chip.active { background: linear-gradient(135deg,var(--accent),#005fbf); border-color: var(--accent); box-shadow: 0 3px 12px rgba(26,140,255,.3); }
    .date-chip.active .dc-day, .date-chip.active .dc-dow { color: #fff; }
    .date-chip.has-data { border-color: var(--accent2); }
    .date-chip.has-data .dc-day { color: var(--accent2); }
    .date-chip.today-chip:not(.active) { border-color: var(--excusa); }
    .date-chip.today-chip:not(.active) .dc-dow { color: var(--excusa); }
    .date-label-full {
      text-align: center; padding: 4px 0;
      font-family: 'Rajdhani', sans-serif; font-size: 12px;
      font-weight: 600; letter-spacing: 1px; color: var(--accent2);
      background: var(--bg); border-bottom: 1px solid var(--border);
      position: sticky; top: 154px; z-index: 97;
    }

    /* MAIN */
    main { flex: 1; padding: 12px 10px 120px; }
    .cuarto-label {
      font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--accent); padding: 4px 10px;
      border-left: 4px solid var(--accent);
      margin-bottom: 8px; margin-top: 16px;
    }

    /* STUDENT CARD */
    .student-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 8px; overflow: hidden;
    }
    .student-top {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px 7px;
    }
    .student-num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: var(--text2); flex-shrink: 0;
    }
    .student-info { flex: 1; min-width: 0; }
    .student-name { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.2; }
    .student-course {
      display: inline-block; margin-top: 2px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 6px;
      font-size: 9px; font-weight: 700; letter-spacing: 1px;
      color: var(--accent); text-transform: uppercase;
    }
    .status-indicator {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--border); flex-shrink: 0; transition: background .2s;
    }
    .status-indicator.presente { background: var(--presente); box-shadow: 0 0 7px var(--presente); }
    .status-indicator.ausente  { background: var(--ausente);  box-shadow: 0 0 7px var(--ausente); }
    .status-indicator.excusa   { background: var(--excusa);   box-shadow: 0 0 7px var(--excusa); }

    /* BUTTONS */
    .btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 0 9px 9px; }
    .asist-btn {
      border: 1.5px solid var(--border); border-radius: 7px;
      background: transparent; color: var(--text2);
      font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700;
      padding: 7px 4px; cursor: pointer; transition: all .15s;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .asist-btn .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .asist-btn.p .dot { background: var(--presente); }
    .asist-btn.a .dot { background: var(--ausente); }
    .asist-btn.e .dot { background: var(--excusa); }
    .asist-btn.active-p { background: rgba(0,201,141,.12); border-color: var(--presente); color: var(--presente); }
    .asist-btn.active-a { background: rgba(255,75,110,.12); border-color: var(--ausente);  color: var(--ausente); }
    .asist-btn.active-e { background: rgba(247,201,72,.12);  border-color: var(--excusa);   color: var(--excusa); }

    /* BOTTOM BAR */
    #resumen-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 6px 14px 12px;
      display: flex; flex-direction: column; gap: 6px;
      z-index: 200; box-shadow: 0 -8px 30px rgba(0,0,0,.4);
    }
    .res-row-top { display: flex; align-items: center; gap: 8px; }
    .res-row-btns { display: flex; gap: 7px; }
    .res-item { display: flex; align-items: center; gap: 5px; flex: 1; justify-content: center; }
    .res-dot { width: 9px; height: 9px; border-radius: 50%; }
    .res-label { font-size: 10px; color: var(--text2); }
    .res-num { font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 700; line-height: 1; }
    .res-num.p { color: var(--presente); }
    .res-num.a { color: var(--ausente); }
    .res-num.e { color: var(--excusa); }

      color: #fff; cursor: pointer; flex: 1; text-align: center;
    }
    .btn-total { background: linear-gradient(135deg, #c0392b, #e74c3c); }
    .btn-mes   { background: linear-gradient(135deg, #6c3483, #9b59b6); }

    /* MODAL */
    #modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.75); backdrop-filter: blur(4px);
      align-items: flex-end; justify-content: center;
    }
    #modal-overlay.show { display: flex; }
    #modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px 20px 0 0; padding: 22px 18px 34px;
      width: 100%; max-width: 520px;
    }
    #modal h2 {
      font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px;
      color: var(--accent2);
    }
    #export-text {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; font-size: 11px;
      color: var(--text); white-space: pre-wrap; line-height: 1.7;
      max-height: 38vh; overflow-y: auto; font-family: monospace;
      margin-bottom: 12px;
    }
    .modal-btns { display: flex; gap: 9px; }
    .modal-btn {
      flex: 1; padding: 11px; border-radius: 10px; border: none;
      font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .modal-btn.pdf { background: linear-gradient(135deg,#c0392b,#e74c3c); color: #fff; }
    .modal-btn.copy { background: linear-gradient(135deg,var(--accent),var(--accent2)); color: #fff; }
    .modal-btn.close-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }

    /* TOAST */
    #toast {
      position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
      background: var(--presente); color: var(--bg);
      padding: 8px 20px; border-radius: 20px;
      font-size: 13px; font-weight: 700;
      opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 400;
    }
    #toast.show { opacity: 1; }
  </style>
</head>

<div id="app">
  <header>
    <div class="logo-circle">UNA<br>CIF</div>
    <div class="header-text">
      <h1>Pabellones</h1>
      <p>Bienestar Estudiantil · UNACIFOR</p>
    </div>
    <div class="header-right">
      <div id="fecha-hora"></div>
      <div id="reloj"></div>
      <div class="online-row">
        <div id="online-dot"></div>
        <span id="online-txt">conectando...</span>
      </div>
    </div>
  </header>

  <div class="tabs-bar" id="tabs-bar"></div>

  <div class="date-bar">
    <button class="date-arrow" onclick="scrollDates(-1)">&#8249;</button>
    <div class="dates-scroll" id="dates-scroll"></div>
    <button class="date-arrow" onclick="scrollDates(1)">&#8250;</button>
  </div>
  <div class="date-label-full" id="date-label-full"></div>

  <main id="main-content"></main>

  <div id="resumen-bar">
    <div class="res-row-top">
      <div class="res-item">
        <div class="res-dot" style="background:var(--presente)"></div>
        <div><div class="res-num p" id="cnt-p">0</div><div class="res-label">Presente</div></div>
      </div>
      <div class="res-item">
        <div class="res-dot" style="background:var(--ausente)"></div>
        <div><div class="res-num a" id="cnt-a">0</div><div class="res-label">Ausente</div></div>
      </div>
      <div class="res-item">
        <div class="res-dot" style="background:var(--excusa)"></div>
        <div><div class="res-num e" id="cnt-e">0</div><div class="res-label">Excusa</div></div>
      </div>
    </div>
    <div class="res-row-btns">
      <button class="btn-exportar" onclick="openExport()">📋 Pabellón</button>
      <button class="btn-exportar btn-total" onclick="descargarPDFTotal()">⬇ Día</button>
      <button class="btn-exportar btn-mes" onclick="abrirModalMes()">📅 Mes</button>
    </div>
  </div>
</div>

<!-- Modal selector de mes -->
<div id="modal-mes" onclick="cerrarModalMesOutside(event)" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:22px 18px 34px;width:100%;max-width:520px;">
    <h2 style="font-family:Rajdhani,sans-serif;font-size:18px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent2);margin-bottom:16px;">📅 Reporte Mensual</h2>
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px;">Selecciona el mes y pabellón a descargar:</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
      <div>
        <label style="font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:4px;">MES</label>
        <select id="sel-mes" style="width:100%;padding:9px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-family:Nunito,sans-serif;font-size:13px;"></select>
      </div>
      <div>
        <label style="font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:4px;">PABELLÓN</label>
        <select id="sel-pab-mes" style="width:100%;padding:9px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-family:Nunito,sans-serif;font-size:13px;"></select>
      </div>
    </div>
    <div style="display:flex;gap:9px;">
      <button onclick="descargarPDFMes()" style="flex:1;padding:11px;border-radius:10px;border:none;background:linear-gradient(135deg,#6c3483,#9b59b6);color:#fff;font-family:Nunito,sans-serif;font-size:13px;font-weight:700;cursor:pointer;">⬇ Descargar PDF</button>
      <button onclick="cerrarModalMes()" style="flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:Nunito,sans-serif;font-size:13px;font-weight:700;cursor:pointer;">Cerrar</button>
    </div>
  </div>
</div>

<div id="modal-overlay" onclick="closeExportOutside(event)">
  <div id="modal">
    <h2>📋 Reporte de Asistencia</h2>
    <div id="export-text"></div>
    <div class="modal-btns">
      <button class="modal-btn pdf" onclick="descargarPDF()">⬇ PDF</button>
      <button class="modal-btn copy" onclick="copiarReporte()">Copiar</button>
      <button class="modal-btn close-btn" onclick="closeExport()">Cerrar</button>
    </div>
  </div>
</div>

<div id="toast">¡Copiado!</div>

// ── FECHAS ────────────────────────────────────────────────────────────────────
// Fechas desde 8 abril hasta 31 diciembre 2026
const ABRIL_FECHAS = [];
var _inicio = new Date(2026, 3, 8);   // abril = mes 3
var _fin    = new Date(2026, 11, 31); // diciembre = mes 11
for (var _d = new Date(_inicio); _d <= _fin; _d.setDate(_d.getDate()+1)) {
  var _y = _d.getFullYear();
  var _m = _d.getMonth()+1;
  var _day = _d.getDate();
  ABRIL_FECHAS.push(_y+"-"+(_m<10?"0":"")+_m+"-"+(_day<10?"0":"")+_day);
}

function todayStr() {
  var n = new Date();
  return n.getFullYear() + "-" + (n.getMonth()<9?"0":"") + (n.getMonth()+1) + "-" + (n.getDate()<10?"0":"") + n.getDate();
}
var fechaActual = ABRIL_FECHAS.indexOf(todayStr()) >= 0 ? todayStr() : ABRIL_FECHAS[0];

var DIAS_ES  = ["Dom","Lun","Mar","Mie","Jue","Vie","Sab"];
var MESES_ES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function parseFecha(s) { var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }

// ── FIREBASE CACHE ────────────────────────────────────────────────────────────
var localCache = {};   // localCache[fecha][pab][cuartoKey][idx]
var activeListener = null;

// Firebase keys cannot contain . # $ [ ] /
function fbKey(s) { return s.replace(/[.#$\[\]\/]/g, "_"); }

function getEstado(pab, cuarto, idx) {
  try { return localCache[fechaActual][pab][fbKey(cuarto)][idx] || ""; } catch(e) { return ""; }
}

function setEstado(pab, cuarto, idx, val) {
  var k = fbKey(cuarto);
  if (!localCache[fechaActual]) localCache[fechaActual] = {};
  if (!localCache[fechaActual][pab]) localCache[fechaActual][pab] = {};
  if (!localCache[fechaActual][pab][k]) localCache[fechaActual][pab][k] = {};
  localCache[fechaActual][pab][k][idx] = val;
  var refPath = db.ref("asistencia/" + fechaActual + "/" + pab + "/" + k + "/" + idx);
  if (val === "") { refPath.remove(); } else { refPath.set(val); }
}

function hasDayData(fecha) {
  var d = localCache[fecha];
  if (!d) return false;
  var pabs = Object.keys(d);
  for (var i=0; i<pabs.length; i++) {
    var cuartos = Object.keys(d[pabs[i]]||{});
    for (var j=0; j<cuartos.length; j++) {
      var idxs = Object.keys(d[pabs[i]][cuartos[j]]||{});
      for (var k=0; k<idxs.length; k++) {
        if (d[pabs[i]][cuartos[j]][idxs[k]]) return true;
      }
    }
  }
  return false;
}

function subscribeToDate(fecha) {
  if (activeListener) { activeListener(); activeListener = null; }
  var r = db.ref("asistencia/" + fecha);
  activeListener = r.on("value", function(snap) {
    localCache[fecha] = snap.val() || {};
    renderMain();
    updateResumen();
    renderDates();
    setOnline(true);
  }, function() { setOnline(false); });
}

// Preload all dates once to show dots
function preloadDots() {
  db.ref("asistencia").once("value", function(snap) {
    var all = snap.val() || {};
    ABRIL_FECHAS.forEach(function(f) { if (all[f]) localCache[f] = all[f]; });
    renderDates();
  });
}

function setOnline(on) {
  var dot = document.getElementById("online-dot");
  var txt = document.getElementById("online-txt");
  if (dot) dot.style.background = on ? "var(--presente)" : "var(--ausente)";
  if (txt) txt.textContent = on ? "en línea" : "sin conexión";
}

// ── DATES BAR ─────────────────────────────────────────────────────────────────
function renderDates() {
  var scroll = document.getElementById("dates-scroll");
  var hoy = todayStr();
  var chips = scroll.querySelectorAll(".date-chip");
  if (chips.length === ABRIL_FECHAS.length) {
    ABRIL_FECHAS.forEach(function(f, i) {
      var cls = "date-chip";
      if (f === fechaActual) cls += " active";
      else if (hasDayData(f)) cls += " has-data";
      if (f === hoy) cls += " today-chip";
      chips[i].className = cls;
    });
    return;
  }
  scroll.innerHTML = "";
  ABRIL_FECHAS.forEach(function(f) {
    var dt = parseFecha(f);
    var btn = document.createElement("button");
    var cls = "date-chip";
    if (f === fechaActual) cls += " active";
    else if (hasDayData(f)) cls += " has-data";
    if (f === hoy) cls += " today-chip";
    btn.className = cls;
    btn.innerHTML = '<span class="dc-day">'+dt.getDate()+'</span><span class="dc-dow">'+DIAS_ES[dt.getDay()]+'</span>';
    btn.onclick = (function(fecha) { return function() {
      fechaActual = fecha;
      renderDates(); updateDateLabel(); renderMain(); updateResumen();
      subscribeToDate(fecha);
    }; })(f);
    scroll.appendChild(btn);
  });
  var active = scroll.querySelector(".date-chip.active");
  if (active) active.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
}

function updateDateLabel() {
  var dt = parseFecha(fechaActual);
  var extra = fechaActual === todayStr() ? " · HOY" : "";
  document.getElementById("date-label-full").textContent =
    DIAS_ES[dt.getDay()] + ", " + dt.getDate() + " de " + MESES_ES[dt.getMonth()] + " " + dt.getFullYear() + extra;
}

function scrollDates(dir) {
  var idx = ABRIL_FECHAS.indexOf(fechaActual);
  var next = idx + dir;
  if (next >= 0 && next < ABRIL_FECHAS.length) {
    fechaActual = ABRIL_FECHAS[next];
    renderDates(); updateDateLabel(); renderMain(); updateResumen();
    subscribeToDate(fechaActual);
  }
}

// ── TABS ──────────────────────────────────────────────────────────────────────
var pabActual = Object.keys(DATA)[0];

function renderTabs() {
  var bar = document.getElementById("tabs-bar");
  bar.innerHTML = "";
  Object.keys(DATA).forEach(function(pab) {
    var btn = document.createElement("button");
    btn.className = "tab-btn" + (pab === pabActual ? " active" : "");
    btn.textContent = pab;
    btn.onclick = function() { pabActual = pab; renderTabs(); renderMain(); updateResumen(); };
    bar.appendChild(btn);
  });
}

// ── CARDS ─────────────────────────────────────────────────────────────────────
// Use numeric cuartoIdx in onclick — avoids ALL string escaping issues
function cardHTML(cuarto, cuartoIdx, idx, al, estado) {
  var pC = estado==="presente"?"active-p":"";
  var aC = estado==="ausente"?"active-a":"";
  var eC = estado==="excusa"?"active-e":"";
  var indC = estado||"";
  var id = "c"+cuartoIdx+"_"+idx;
  return '<div class="student-card" id="card-'+id+'">'
    +'<div class="student-top">'
    +'<div class="student-num">'+(idx+1)+'</div>'
    +'<div class="student-info"><div class="student-name">'+al.nombre+'</div>'
    +'<span class="student-course">'+al.curso+'</span></div>'
    +'<div class="status-indicator '+indC+'"></div>'
    +'</div>'
    +'<div class="btn-row">'
    +'<button class="asist-btn p '+pC+'" onclick="marcar('+cuartoIdx+','+idx+',\'presente\')"><span class="dot"></span> Presente</button>'
    +'<button class="asist-btn a '+aC+'" onclick="marcar('+cuartoIdx+','+idx+',\'ausente\')"><span class="dot"></span> Ausente</button>'
    +'<button class="asist-btn e '+eC+'" onclick="marcar('+cuartoIdx+','+idx+',\'excusa\')"><span class="dot"></span> Excusa</button>'
    +'</div></div>';
}

function renderMain() {
  var main = document.getElementById("main-content");
  var html = "";
  var cuartos = Object.entries(DATA[pabActual]);
  cuartos.forEach(function(entry, ci) {
    html += '<div class="cuarto-label">'+entry[0]+'</div>';
    entry[1].forEach(function(al, idx) {
      html += cardHTML(entry[0], ci, idx, al, getEstado(pabActual, entry[0], idx));
    });
  });
  main.innerHTML = html;
}

function marcar(cuartoIdx, idx, estado) {
  var cuarto = Object.keys(DATA[pabActual])[cuartoIdx];
  // Si toca el mismo botón que ya estaba activo, lo desmarca
  var actual = getEstado(pabActual, cuarto, idx);
  var nuevoEstado = (actual === estado) ? "" : estado;
  setEstado(pabActual, cuarto, idx, nuevoEstado);
  var al = DATA[pabActual][cuarto][idx];
  var id = "card-c"+cuartoIdx+"_"+idx;
  var card = document.getElementById(id);
  if (card) card.outerHTML = cardHTML(cuarto, cuartoIdx, idx, al, nuevoEstado);
  updateResumen();
}

// ── RESUMEN ───────────────────────────────────────────────────────────────────
function updateResumen() {
  var p=0, a=0, e=0;
  Object.entries(DATA[pabActual]).forEach(function(en) {
    en[1].forEach(function(_, idx) {
      var est = getEstado(pabActual, en[0], idx);
      if (est==="presente") p++;
      else if (est==="ausente") a++;
      else if (est==="excusa") e++;
    });
  });
  document.getElementById("cnt-p").textContent = p;
  document.getElementById("cnt-a").textContent = a;
  document.getElementById("cnt-e").textContent = e;
}

// ── CLOCK ─────────────────────────────────────────────────────────────────────
function updateClock() {
  var now = new Date();
  var dc = ["Dom","Lun","Mar","Mie","Jue","Vie","Sab"];
  var mc = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  document.getElementById("fecha-hora").textContent = dc[now.getDay()]+" "+now.getDate()+" "+mc[now.getMonth()];
  document.getElementById("reloj").textContent = (now.getHours()<10?"0":"")+now.getHours()+":"+(now.getMinutes()<10?"0":"")+now.getMinutes();
}

// ── EXPORT ────────────────────────────────────────────────────────────────────
function buildReporteData() {
  var now = new Date();
  var dt = parseFecha(fechaActual);
  var fechaStr = DIAS_ES[dt.getDay()]+" "+dt.getDate()+" de "+MESES_ES[dt.getMonth()]+" 2026";
  var hora = (now.getHours()<10?"0":"")+now.getHours()+":"+(now.getMinutes()<10?"0":"")+now.getMinutes();
  var tP=0,tA=0,tE=0;
  var cuartos = [];
  Object.entries(DATA[pabActual]).forEach(function(en) {
    var filas = [];
    en[1].forEach(function(al, idx) {
      var est = getEstado(pabActual, en[0], idx);
      if(est==="presente")tP++; else if(est==="ausente")tA++; else if(est==="excusa")tE++;
      filas.push({ nombre: al.nombre, curso: al.curso, estado: est });
    });
    cuartos.push({ nombre: en[0], filas: filas });
  });
  return { pab: pabActual, fechaStr: fechaStr, hora: hora, tP: tP, tA: tA, tE: tE, cuartos: cuartos };
}

  txt += "BIENESTAR ESTUDIANTIL - CONTROL DE PABELLONES\n";
  txt += "-----------------------------------------\n";
  txt += "Pabellon: "+r.pab+"\n";
  txt += "Fecha: "+r.fechaStr+"\n";
  txt += "Hora: "+r.hora+"\n";
  txt += "-----------------------------------------\n\n";
  r.cuartos.forEach(function(c) {
    txt += "[ "+c.nombre+" ]\n";
    c.filas.forEach(function(f) {
      var lbl = f.estado==="presente"?"[P]":f.estado==="ausente"?"[A]":f.estado==="excusa"?"[E]":"[ ]";
      var tag = f.estado ? f.estado.toUpperCase() : "SIN MARCAR";
      var pad = f.nombre; while(pad.length<34) pad+=" ";
      txt += "  "+lbl+" "+pad+tag+"\n";
    });
    txt += "\n";
  });
  txt += "-----------------------------------------\n";
  txt += "TOTAL: Presentes "+r.tP+"  Ausentes "+r.tA+"  Excusas "+r.tE+"\n";
  txt += "-----------------------------------------\n";
  txt += "Supervisor/a: _________________________\n";
  txt += "Firma:        _________________________";
  return txt;
}

function abrirModalMes() {
  // Poblar select de meses disponibles
  var meses = {};
  ABRIL_FECHAS.forEach(function(f) {
    var dt = parseFecha(f);
    var key = dt.getFullYear()+"-"+(dt.getMonth()+1<10?"0":"")+(dt.getMonth()+1);
    var label = MESES_ES[dt.getMonth()]+" "+dt.getFullYear();
    meses[key] = label;
  });
  var selMes = document.getElementById("sel-mes");
  selMes.innerHTML = "";
  Object.keys(meses).forEach(function(k) {
    var opt = document.createElement("option");
    opt.value = k; opt.textContent = meses[k];
    // Pre-seleccionar mes actual
    var now = new Date();
    var curKey = now.getFullYear()+"-"+(now.getMonth()+1<10?"0":"")+(now.getMonth()+1);
    if(k === curKey) opt.selected = true;
    selMes.appendChild(opt);
  });
  // Poblar select de pabellones
  var selPab = document.getElementById("sel-pab-mes");
  selPab.innerHTML = '<option value="TODOS">Todos los pabellones</option>';
  Object.keys(DATA).forEach(function(pab) {
    var opt = document.createElement("option");
    opt.value = pab; opt.textContent = pab;
    if(pab === pabActual) opt.selected = true;
    selPab.appendChild(opt);
  });
  var m = document.getElementById("modal-mes");
  m.style.display = "flex";
}

function cerrarModalMes() { document.getElementById("modal-mes").style.display = "none"; }
function cerrarModalMesOutside(e) { if(e.target===document.getElementById("modal-mes")) cerrarModalMes(); }

function descargarPDFMes() {
  var mesKey  = document.getElementById("sel-mes").value;       // "2026-04"
  var pabSel  = document.getElementById("sel-pab-mes").value;   // "LAURELES" | "TODOS"
  var partes  = mesKey.split("-");
  var anio    = +partes[0]; var mes = +partes[1];
  var mesNombre = MESES_ES[mes-1]+" "+anio;

  // Fechas del mes seleccionado que están en nuestro rango
  var fechasMes = ABRIL_FECHAS.filter(function(f) {
    var dt = parseFecha(f);
    return dt.getFullYear()===anio && (dt.getMonth()+1)===mes;
  });

  if (fechasMes.length === 0) { alert("No hay fechas disponibles para ese mes."); return; }

  var pabellones = pabSel === "TODOS" ? Object.keys(DATA) : [pabSel];
  var doc = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  var pageW = 297; var pageH = 210; var margin = 10;
  var firstPage = true;

  pabellones.forEach(function(pab) {
    if (!firstPage) doc.addPage();
    firstPage = false;

    // ── Header ──
    doc.setFillColor(26,111,204);
    doc.rect(0,0,pageW,22,"F");
    doc.setTextColor(255,255,255);
    doc.setFont("helvetica","bold"); doc.setFontSize(12);
    doc.text("UNIVERSIDAD NACIONAL DE CIENCIAS FORESTALES  ·  Control de Pabellones", pageW/2, 9, {align:"center"});
    doc.setFontSize(9);
    doc.text("Pabellon: "+pab+"   |   Mes: "+mesNombre+"   |   Total de noches: "+fechasMes.length, pageW/2, 17, {align:"center"});

    var y = 30;
    // Agrupar estudiantes por cuarto
    var cuartos = Object.entries(DATA[pab]);

    // Calcular ancho de columnas
    var colFecha = 14;  // ancho por columna de fecha
    var colNombre = 55;
    var colCurso = 16;
    var maxFechas = Math.floor((pageW - margin*2 - colNombre - colCurso) / colFecha);
    // Si hay más fechas que caben, dividir en bloques
    var bloques = [];
    for (var i=0; i<fechasMes.length; i+=maxFechas) {
      bloques.push(fechasMes.slice(i, i+maxFechas));
    }

    bloques.forEach(function(bloqueFechas, blkIdx) {
      if (blkIdx > 0) { doc.addPage(); y = 30; }

      // Cabecera de columnas fechas
      doc.setFillColor(230,238,248);
      doc.rect(margin, y-4, pageW-margin*2, 7, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(26,111,204);
      doc.text("ESTUDIANTE", margin+1, y);
      doc.text("CURSO", margin+colNombre+1, y);
      var xf = margin+colNombre+colCurso;
      bloqueFechas.forEach(function(f) {
        var dt = parseFecha(f);
        var DIAS_SHORT = ["D","L","M","X","J","V","S"];
        doc.text(DIAS_SHORT[dt.getDay()]+"
"+dt.getDate(), xf+colFecha/2, y-1, {align:"center"});
        xf += colFecha;
      });
      // Totales header
      doc.text("P", xf+3, y); doc.text("A", xf+8, y); doc.text("E", xf+13, y);
      y += 5;

      // Filas estudiantes por cuarto
      cuartos.forEach(function(entry) {
        var cuarto = entry[0]; var alumnos = entry[1];
        // Etiqueta cuarto
        if (y > pageH-15) { doc.addPage(); y = 14; }
        doc.setFillColor(220,232,245);
        doc.rect(margin, y-3, pageW-margin*2, 5.5, "F");
        doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(26,111,204);
        doc.text(cuarto.toUpperCase(), margin+1, y+1);
        y += 6;

        alumnos.forEach(function(al, idx) {
          if (y > pageH-8) { doc.addPage(); y = 14; }
          var rowP=0, rowA=0, rowE=0;
          // Fila alternada
          if (idx%2===0) { doc.setFillColor(247,250,253); doc.rect(margin,y-3,pageW-margin*2,5.5,"F"); }
          doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(26,38,53);
          // Nombre (truncar si es muy largo)
          var nom = al.nombre.length>28 ? al.nombre.substring(0,27)+"." : al.nombre;
          doc.text(nom, margin+1, y+1);
          doc.setTextColor(74,96,128);
          doc.text(al.curso, margin+colNombre+1, y+1);

          var xc = margin+colNombre+colCurso;
          bloqueFechas.forEach(function(f) {
            // Leer estado de localCache para esa fecha
            var est = "";
            try {
              var _fd = localCache[f] || {};
              var _pd = _fd[pab] || {};
              var _cd = _pd[fbKey(cuarto)] || {};
              est = _cd[idx] || "";
            } catch(e){}
            var sym = est==="presente"?"P":est==="ausente"?"A":est==="excusa"?"E":"-";
            var col = est==="presente"?[10,158,106]:est==="ausente"?[217,48,85]:est==="excusa"?[192,120,0]:[180,180,180];
            doc.setFont("helvetica","bold"); doc.setTextColor(col[0],col[1],col[2]);
            doc.text(sym, xc+colFecha/2, y+1, {align:"center"});
            if(est==="presente")rowP++; else if(est==="ausente")rowA++; else if(est==="excusa")rowE++;
            xc += colFecha;
          });
          // Totales fila
          doc.setFont("helvetica","bold");
          doc.setTextColor(10,158,106);  doc.text(String(rowP), xc+3,  y+1);
          doc.setTextColor(217,48,85);   doc.text(String(rowA), xc+8,  y+1);
          doc.setTextColor(192,120,0);   doc.text(String(rowE), xc+13, y+1);
          y += 5.5;
        });
        y += 2;
      });
    });
  });

  var fileName = "Asistencia_"+mesNombre.replace(/ /g,"_")+"_"+(pabSel==="TODOS"?"TODOS":pabSel)+".pdf";
  doc.save(fileName);
  cerrarModalMes();
}
